<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonida Trophy Ledger — GTA VI PS5 Trophy Guide & Offline Tracker</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header" id="app-header">
      <div class="brand-progress">
        <div class="ring-wrap" aria-label="Overall trophy completion">
          <svg class="ring-svg" viewBox="0 0 68 68" role="img" aria-label="Completion ring">
            <circle class="ring-track" cx="34" cy="34" r="28"></circle>
            <circle class="ring-fill" id="progress-ring-arc" cx="34" cy="34" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93"></circle>
          </svg>
          <div class="ring-center">
            <span class="ring-pct" id="progress-pct">0%</span>
            <span class="ring-frac" id="progress-frac">0/55</span>
          </div>
        </div>
        <div class="title-block">
          <h1>Leonida Trophy Ledger</h1>
          <p class="subtitle">GTA VI (PS5) · 55 Official Trophies · 28 Hidden · 0 Online · Offline Tracker</p>
        </div>
      </div>

      <div class="grade-summary-bar" id="grade-summary" aria-label="Counts per trophy grade"></div>

      <div class="header-actions">
        <button id="btn-spoiler" class="btn btn-spoiler-on" type="button" aria-pressed="true">Spoiler Shield: ON</button>
        <button id="btn-export" class="btn" type="button">Export JSON</button>
        <label class="btn" for="input-import">
          Import JSON
          <input id="input-import" class="sr-only" type="file" accept="application/json,.json">
        </label>
        <button id="btn-reset" class="btn btn-danger" type="button">Reset</button>
      </div>
    </header>

    <nav class="nav-bar" aria-label="Primary views">
      <div class="tab-group" role="tablist">
        <button id="tab-checklist" class="tab-btn is-active" type="button" role="tab" aria-selected="true">Checklist &amp; Guides (55)</button>
        <button id="tab-roadmap" class="tab-btn" type="button" role="tab" aria-selected="false">Platinum Roadmap &amp; Missables</button>
      </div>
      <div id="status-toast" class="status-toast" role="status" aria-live="polite"></div>
    </nav>

    <main id="view-checklist" class="workspace-grid">
      <section class="list-column" aria-label="Trophy checklist and filters">
        <div class="filter-panel">
          <div class="filter-row">
            <input id="search-input" class="search-input" type="search" placeholder="Search trophy name, description, or guide… (Press /)" aria-label="Search trophies">
            <select id="filter-grade" class="filter-select" aria-label="Filter by grade">
              <option value="all">All Grades (55)</option>
              <option value="platinum">Platinum (1)</option>
              <option value="gold">Gold (2)</option>
              <option value="silver">Silver (6)</option>
              <option value="bronze">Bronze (46)</option>
            </select>
            <select id="filter-status" class="filter-select" aria-label="Filter by earned status">
              <option value="all">All Status</option>
              <option value="earned">Earned Only</option>
              <option value="unearned">Not Earned</option>
            </select>
            <button id="btn-clear-filters" class="btn" type="button">Clear Filters</button>
          </div>

          <div class="chip-bar" id="kind-chips" aria-label="Filter by kind">
            <span class="chip-label">Kind:</span>
            <button class="chip is-active" type="button" data-kind="all">All</button>
            <button class="chip" type="button" data-kind="story">Story (12)</button>
            <button class="chip" type="button" data-kind="side">Side (13)</button>
            <button class="chip" type="button" data-kind="secret">Secret (11)</button>
            <button class="chip" type="button" data-kind="misc">Misc (19)</button>
          </div>

          <div class="chip-bar" id="category-chips" aria-label="Quick category filters">
            <span class="chip-label">Focus:</span>
            <button class="chip is-active" type="button" data-category="all">Everything</button>
            <button class="chip chip-warn" type="button" data-category="missable">Missable (1)</button>
            <button class="chip" type="button" data-category="collectibles">Collectibles</button>
            <button class="chip" type="button" data-category="activities">Activities</button>
            <button class="chip" type="button" data-category="strangers">Strangers</button>
            <button class="chip" type="button" data-category="heists">Heists &amp; Crime</button>
            <button class="chip" type="button" data-category="online">Online (0)</button>
            <button class="chip chip-hidden" id="btn-hidden-only" type="button" aria-pressed="false">Hidden Only (28)</button>
          </div>
        </div>

        <div class="results-meta">
          <span id="results-count">Showing 55 of 55 trophies</span>
          <span id="spoiler-hint">Story &amp; hidden trophies blurred until earned</span>
        </div>

        <div id="trophy-list" class="trophy-list" role="list"></div>
      </section>

      <aside id="trophy-detail" class="detail-column" aria-label="Selected trophy guide"></aside>
    </main>

    <section id="view-roadmap" class="roadmap-view is-hidden" aria-label="Platinum roadmap and missables"></section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
